<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="rp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="rp-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="rp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="14" fill="url(#rp-bg)" />
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#6366F1" stroke-width="1.5" stroke-opacity="0.4" fill="none" />

  <!-- Shield Base Outline -->
  <path d="M32 10 L48 16 V28 C48 40 32 50 32 50 C32 50 16 40 16 28 V16 L32 10 Z" 
        fill="#1E1B4B" 
        fill-opacity="0.6" 
        stroke="#818CF8" 
        stroke-width="1.5" 
        stroke-opacity="0.6" />

  <!-- Heartbeat / Risk Pulse Waveform Line -->
  <path d="M14 33 H22 L27 21 L34 45 L40 26 L44 35 L47 33 H50" 
        stroke="url(#rp-pulse)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#rp-glow)" />

  <!-- Live Pulse Beacon Dot -->
  <circle cx="47" cy="33" r="2.5" fill="#38BDF8" filter="url(#rp-glow)" />
</svg>
